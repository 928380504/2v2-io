# 项目名称和兼容性设置
name = "stimulation-clicker"
compatibility_date = "2023-12-01"
compatibility_flags = ["nodejs_compat"]

# Pages 构建配置
[build]
command = "npm install && npm run build && cp -r out/* ."
pages_build_output_dir = "."

# 环境变量
[vars]
NODE_ENV = "production"

# Node.js 版本
[build.environment]
NODE_VERSION = "18" 